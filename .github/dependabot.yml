version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let Mergify handle rebasing so Dependabot does not trigger redundant CI runs.
    # Note: Mergify still rebases inside the queue before merging.
    rebase-strategy: "disabled"
    groups:
      # Consolidate all Cargo bumps into a single weekly PR
      cargo-all:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/crumbs-gui"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    groups:
      # One PR for all CodeMirror packages
      codemirror:
        patterns:
          - "@codemirror/*"
      # One PR for all Tauri npm packages
      tauri-npm:
        patterns:
          - "@tauri-apps/*"
      # One PR for everything else in crumbs-gui.
      # NOTE: exclude-patterns must mirror every other named group's
      # patterns above, since Dependabot groups can't reference each
      # other. Adding a new named group requires adding its pattern
      # here too, or its packages will double up into both groups.
      npm-other:
        patterns:
          - "*"
        exclude-patterns:
          - "@codemirror/*"
          - "@tauri-apps/*"
