version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let Mergify handle rebasing so Dependabot doesn't trigger redundant CI runs
    rebase-strategy: "disabled"
    groups:
      # Consolidate all Cargo bumps into a single weekly PR
      cargo-all:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/crumbs-gui"
    schedule:
      interval: "weekly"
    rebase-strategy: "disabled"
    groups:
      # One PR for all CodeMirror packages
      codemirror:
        patterns:
          - "@codemirror/*"
      # One PR for all Tauri npm packages
      tauri-npm:
        patterns:
          - "@tauri-apps/*"
