name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Lint (clippy)
        run: cargo clippy -p crumbs --all-targets -- -D warnings

      - name: Run tests
        run: cargo nextest run -p crumbs

      - name: Check GUI backend compiles
        run: cargo check -p crumbs-gui
