# Mergify configuration
# Docs: https://docs.mergify.com/

# Block auto-merge for major-version bumps — those need a human decision
merge_protections:
  - name: No auto-merge on major Dependabot bumps
    if:
      - author = dependabot[bot]
    success_conditions:
      - dependabot-update-type != version-update:semver-major

# Merge queue: only merge after CI is green.
# The pull_request_rules queue action is the sole enqueue path;
# merge_protections_settings.auto_merge_conditions is omitted to avoid
# a duplicate queue entry for the same PR.
queue_rules:
  - name: default
    queue_conditions:
      - check-success = CI / test
    merge_conditions:
      - check-success = CI / test

# Approve and enqueue Dependabot patch/minor updates automatically
pull_request_rules:
  - name: Auto-approve and queue Dependabot patch/minor updates
    conditions:
      - author = dependabot[bot]
      - dependabot-update-type != version-update:semver-major
    actions:
      review:
        type: APPROVE
      queue:
        name: default
